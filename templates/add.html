{% extends "base.html" %}
{% block content %}
{% set field = 'mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 outline-none focus:ring-2 focus:ring-brand' %}
<section class="max-w-xl rounded-xl bg-white p-6 shadow-sm">
  <h1 class="mb-4 font-semibold text-slate-800">Register a meter</h1>
  <form method="post" class="space-y-4 text-sm">
    <label class="block">Customer name<input name="customer_name" required class="{{ field }}"></label>
    <label class="block">Meter number<input name="meter_number" required class="{{ field }}"></label>
    <div class="grid gap-4 sm:grid-cols-2">
      <label class="block">Customer type<select name="customer_type" class="{{ field }}">{% for t in types %}<option>{{ t }}</option>{% endfor %}</select></label>
      <label class="block">Location<select name="location" class="{{ field }}">{% for r in regions %}<option>{{ r }}</option>{% endfor %}</select></label>
    </div>
    <label class="block">Meter reading (kWh)<input name="meter_reading" type="number" min="0" step="0.1" value="0" class="{{ field }}"></label>
    <button class="rounded-lg bg-brand px-4 py-2 font-medium text-white hover:bg-blue-800">Save meter</button>
  </form>
</section>
{% endblock %}
