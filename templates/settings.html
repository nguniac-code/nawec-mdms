{% extends "base.html" %}
{% block content %}
{% set field = 'mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 outline-none focus:ring-2 focus:ring-brand' %}
<div class="grid max-w-4xl gap-4 md:grid-cols-2">
<section class="lift rounded-xl bg-white p-6 text-sm shadow-sm"><h1 class="mb-3 font-semibold text-slate-800">Tariffs and validation</h1>
  <form method="post" class="space-y-3"><input type="hidden" name="action" value="tariffs">
    {% for t in ['Residential','Commercial','Industrial'] %}<label class="block">{{ t }} rate per kWh<input name="rate_{{ t }}" type="number" step="0.01" min="0" value="{{ v['rate_' ~ t] }}" class="{{ field }}"></label>{% endfor %}
    <label class="block">Spike factor (flag usage above this multiple of a meter's average)<input name="spike_factor" type="number" step="0.5" min="1" value="{{ v.spike_factor }}" class="{{ field }}"></label>
    <button class="rounded-lg bg-brand px-4 py-2 font-medium text-white hover:bg-blue-800">Save settings</button></form></section>
<section class="lift rounded-xl bg-white p-6 text-sm shadow-sm"><h2 class="mb-3 font-semibold text-slate-800">Change password</h2>
  <form method="post" class="space-y-3"><input type="hidden" name="action" value="password">
    <label class="block">Current password<input name="current" type="password" required class="{{ field }}"></label>
    <label class="block">New password (8+ characters)<input name="new" type="password" required class="{{ field }}"></label>
    <label class="block">Confirm new password<input name="confirm" type="password" required class="{{ field }}"></label>
    <button class="rounded-lg bg-brand px-4 py-2 font-medium text-white hover:bg-blue-800">Change password</button></form></section>
</div>
{% endblock %}
